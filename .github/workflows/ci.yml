# OpenLedgerApp CI — validates only. It never auto-fixes, formats, commits or pushes,
# so forks and copies of this repo get an honest report, not silent changes.
# Every failing job writes the reason to the run summary and as inline annotations.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1" # weekly run catches newly published dependency vulnerabilities

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (money, reports, dates, imports, permissions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Direct database writes (server functions must use shared code)
        # Tracked on its own so a new direct write shows up as a named failure.
        # Fix by moving the write into a service or audited_write; only cloud-only
        # records may carry a `// cloud-only-write: <reason>` comment.
        run: |
          bunx vitest run src/lib/direct-writes.test.ts --reporter=default --reporter=github-actions || {
            echo "### ❌ A server function writes to the database directly. Move it into shared code (see src/lib/direct-writes.test.ts)." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
      - name: Run tests
        run: bunx vitest run --reporter=default --reporter=junit --outputFile.junit=test-results.xml --reporter=github-actions
      - name: Report failures
        if: failure()
        run: echo "### ❌ Unit tests failed — see the annotations above for which rule broke and why. The build was blocked." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: unit-test-results, path: test-results.xml }

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: tsc --noEmit
        run: |
          bunx tsc --noEmit --pretty false 2>&1 | tee tsc.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            echo "### ❌ Type errors (build blocked)" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"; head -50 tsc.log >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $code

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: [unit-tests, typecheck]
    env:
      VITE_SUPABASE_URL: https://ci.invalid
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      VITE_SUPABASE_PROJECT_ID: ci
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: vite build
        run: |
          bun run build 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            echo "### ❌ Build failed" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"; grep -iE "error|failed" build.log | head -30 >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $code

  database:
    name: Database rules (migrations, tenant isolation, ledger invariants)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static migration checks (GRANTs + row level security)
        run: node scripts/ci/check-migrations.mjs
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Start disposable local database and apply every migration
        run: supabase db start
      - name: Run SQL safety checks
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: bash scripts/ci/run-db-tests.sh
      - name: Security advisor (lint)
        if: always()
        run: supabase db lint --level error --fail-on error

  lint:
    name: Lint (code problems — blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: eslint
        run: |
          bunx eslint . --format stylish 2>&1 | tee lint.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            echo "### ❌ Lint errors (real code problems, build blocked)" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"; grep -E "error" lint.log | head -40 >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $code

  format:
    name: Formatting
    runs-on: ubuntu-latest
    # Whitespace/style only. Reported, never auto-applied; run `bun run format` locally to fix.
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run format:check || (echo "### ⚠️ Files not formatted — run \`bun run format\` locally (blocks the build)" >> "$GITHUB_STEP_SUMMARY"; exit 1)

  dependency-audit:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Audit (fails on high/critical)
        # Reviewed exceptions — keep this list short and dated. Each must be dev-only tooling
        # whose input is our own source code, never user data or anything shipped to the app.
        #   2026-10-01 brace-expansion (eslint/typescript-eslint -> minimatch): only expands
        #   glob patterns from our own lint config. Remove once eslint pulls >=1.1.20 / >=5.0.11.
        run: |
          bun audit --audit-level=high \
            --ignore=GHSA-mh99-v99m-4gvg --ignore=GHSA-rgw5-rvv9-x895 \
            --ignore=GHSA-qhr7-859c-m2p7 --ignore=GHSA-6j4f-fj2g-mc7p 2>&1 | tee audit.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            echo "### ❌ High/critical vulnerable packages found — update them manually" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"; head -40 audit.log >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $code
